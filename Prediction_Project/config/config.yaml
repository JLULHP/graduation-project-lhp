# 数据参数
data:
  train_data: 'data/train'
  val_data: 'data/val'
  test_data: 'data/predict'
  preprocessed_train: 'processed_data/train_data.pkl'
  preprocessed_val: 'processed_data/val_data.pkl'
  preprocessed_test: 'processed_data/test_data.pkl'
  obs_len: 20
  pred_len: 80
  min_agents: 1
  max_agents: 50
  min_seq_len: 60

# 模型参数
model:
  n_features: 2
  d_feature_vec: 128
  n_layers: 6
  n_head: 8
  d_k: 64
  d_v: 64
  d_inner: 2048
  dropout: 0.1
  scale_emb: false
  num_targets: 3
  num_paths_per_target: 2
  d_latent: 16

# 损失函数参数
loss:
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  vae_weight: 0.1  
  kl_beta: 0.1
  max_target_distance: 0.005  # 目标点最大允许距离（0.005对应5米）
  smoothness_weight: 0.1  # 平滑度损失权重

# 训练参数
training:
  batch_size: 64
  epochs: 100
  lr: 0.0001  # 降低初始学习率
  lr_step: 30
  lr_gamma: 0.5
  num_workers: 4
  save_dir: 'checkpoints/tnt_transformer'
  save_interval: 10
  use_cache: false
  use_amp: true
  no_cuda: false

# 预测参数
prediction:
  model_path: 'checkpoints/tnt_transformer/best_model.pth'
  test_data: 'data/test'
  output_dir: 'predictions'
  num_visualizations: 10
